name: Deploy NanoKit Documentation

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "assets/images/**"
      - ".github/workflows/deploy-documentation.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Assemble Pages site
        run: |
          mkdir -p _site/assets/images
          cp -R docs/. _site/
          cp assets/images/nanokit-integrated-esp32-pinout-v2020-smd-tht.jpg _site/assets/images/
      - name: Upload documentation workstation
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./_site"
      - name: Deploy documentation workstation
        id: deployment
        uses: actions/deploy-pages@v4
