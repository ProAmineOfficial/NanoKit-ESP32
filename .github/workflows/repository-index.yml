# Developed by Amine Saoud ibn al-Bashir.
name: Refresh Repository Index

on:
  push:
    branches:
      - main

jobs:
  refresh-index:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Regenerate repository index
        run: python tools/update_repository_index.py
      - name: Commit generated repository updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md REPOSITORY_TREE.md REPOSITORY_INDEX.md examples_on_platformio/README.md open_source_projects/README.md applications_on_platformio/README.md
          git diff --cached --quiet || git commit -m "chore: refresh repository indexes"
          git push
