# Developed by Amine Saoud ibn al-Bashir.
# Builds every PlatformIO project in the repository so "everything must compile" is enforced by CI.
# One matrix job per project (fail-fast off), so each example, application and open-source firmware
# gets its own green or red mark in the pull request.
name: PlatformIO Build

on:
  push:
    branches:
      - main
    paths:
      - "**/platformio.ini"
      - "**/src/**"
      - "**/include/**"
      - "**/lib/**"
      - ".github/workflows/platformio-build.yml"
  pull_request:
    paths:
      - "**/platformio.ini"
      - "**/src/**"
      - "**/include/**"
      - "**/lib/**"
      - ".github/workflows/platformio-build.yml"
  workflow_dispatch:

jobs:
  discover:
    name: Find PlatformIO projects
    runs-on: ubuntu-latest
    outputs:
      projects: ${{ steps.list.outputs.projects }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        name: List every folder that contains platformio.ini
        run: |
          projects=$(find . -name platformio.ini -not -path './.git/*' -not -path '*/.pio/*' -not -path './templates/*' \
            | sed 's|/platformio.ini$||; s|^\./||' | sort | jq -R . | jq -cs .)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"
          echo "Projects: $projects"

  build:
    name: ${{ matrix.project }}
    needs: discover
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.projects) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Cache PlatformIO platforms, toolchains and libraries
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/platforms
            ~/.platformio/packages
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('**/platformio.ini') }}
          restore-keys: |
            pio-${{ runner.os }}-
      - name: Install PlatformIO Core
        run: python -m pip install --quiet --upgrade platformio
      - name: Build ${{ matrix.project }}
        run: pio run -d "${{ matrix.project }}"
      - name: Report firmware size
        if: always()
        run: |
          find "${{ matrix.project }}/.pio/build" -name firmware.bin -printf "%p %s bytes\n" 2>/dev/null || true
