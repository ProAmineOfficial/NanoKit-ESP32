; Developed by Amine Saoud ibn al-Bashir.
; NanoKit Drone 4X (Quadcopter) Wi-Fi flight-controller firmware.
; This section keeps the independent Web Control folder inside the firmware project for LittleFS upload.
[platformio]
; PlatformIO packages firmware/web_control while VS Code shows it as a clear project folder.
data_dir = web_control

; This environment targets the ESP32-D0WD-based NanoKit through Arduino PlatformIO.
[env:nanokit_esp32]
; Espressif's PlatformIO platform supplies the compiler, uploader, and ESP32 tools.
platform = espressif32
; esp32dev matches the confirmed ESP32 module and standard flash/upload behavior.
board = esp32dev
; Arduino provides the APIs used by Wi-Fi, FreeRTOS integration, GPIO, and LittleFS.
framework = arduino
; The serial monitor and firmware must use the same speed for readable diagnostics.
monitor_speed = 115200
; A fast upload speed shortens development uploads while preserving the same firmware.
upload_speed = 921600
; LittleFS stores the HTML, CSS, JavaScript, and manifest served by the flight controller.
board_build.filesystem = littlefs

; This project marker allows source code to identify the Wi-Fi Drone 4X build.
build_flags =
  -D NANOKIT_DRONE_4X_WIFI=1

; WebSockets provides the low-latency full-duplex link used by the Flight Deck.
lib_deps =
  links2004/WebSockets
