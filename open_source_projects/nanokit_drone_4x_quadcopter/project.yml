# Developed by Amine Saoud ibn al-Bashir.
name: NanoKit Drone 4X
slug: nanokit_drone_4x_quadcopter
category: open_source_project
status: bench-development
transport: Wi-Fi SoftAP with WebSocket protocol v3
controller:
  board: NanoKit Integrated ESP32
  framework: PlatformIO Arduino
  loop_hz: 250
confirmed_interfaces:
  i2c:
    sda: GPIO21
    scl: GPIO22
  motors:
    m1: GPIO25
    m2: GPIO26
    m3: GPIO27
    m4: GPIO32
safety_defaults:
  esc_analog_pwm_confirmed: false
  sensor_features_enabled: false
  propellers_allowed: false
payload_node:
  minimum_psram: 8 MB
  motor_authority: false
documentation:
  - README.md
  - docs/Architecture.md
  - docs/WiFi_WebSocket_Protocol.md
  - docs/Sensor_Integration.md
  - docs/Camera_Audio_Node.md
  - docs/Wiring.md
  - docs/Safety.md
  - docs/Testing.md
