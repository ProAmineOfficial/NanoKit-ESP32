; Developed by Amine Saoud ibn al-Bashir.
; NanoKit Drone 4X camera and audio node.
; This independent environment builds the second NanoKit ESP32 with no motor authority.
[env:nanokit_camera_audio]
; Espressif's PlatformIO package supplies the ESP32 compiler and upload tools.
platform = espressif32
; The standard ESP32 Dev Module target matches the current NanoKit module class.
board = esp32dev
; Arduino provides Wi-Fi, HTTP, mDNS, serial, and PSRAM APIs used by this node.
framework = arduino
; Match firmware Serial.begin(115200) for readable diagnostics.
monitor_speed = 115200
; Use the established fast serial upload speed without changing runtime behavior.
upload_speed = 921600

; This marker distinguishes camera-node builds from the main flight controller.
build_flags =
  -D NANOKIT_DRONE_4X_CAMERA_NODE=1
