# Developed by Amine Saoud ibn al-Bashir.
# Genius hardware manifest - single source of truth for this project's wiring.
genius: 1
name: PWM LED Fade
category: example
status: complete
board: nanokit-esp32
summary: Fades an LED up and down with the ESP32 LEDC peripheral at 5 kHz / 8 bits, scheduled with millis() and corrected for perceived brightness.

firmware:
  - id: main
    path: .
    code_roots: [src, include]
    wifi: false

docs:
  readme: README.md
  wiring: docs/Wiring.md
  images: images

components:
  - id: led
    name: External LED + 220 ohm resistor
    kind: display
    status: confirmed
    power: { rail: none }
    note: "PWM changes the average current, not the peak; the series resistor still limits the peak at full duty to about 7 mA at 3.3 V."
    pins:
      - { pin: Anode via 220 ohm, gpio: 26, dir: out, type: pwm, symbol: LED_PIN, note: LEDC output sets the LED brightness }
      - { pin: Cathode, rail: GND, note: Return path for the LED current }

  - id: builtin_led
    name: Onboard LED
    kind: display
    status: confirmed
    power: { rail: none }
    note: Receives the same duty on its own LEDC channel so the fade is visible with no wiring at all.
    pins:
      - { pin: LED, gpio: 2, dir: out, type: pwm, symbol: BUILTIN_LED_PIN, note: Onboard LED on the PWM_OUT0 pin }
