# Developed by Amine Saoud ibn al-Bashir.
# Genius hardware manifest - single source of truth for this project's wiring.
genius: 1
name: Camera Tracking
category: example
status: complete
board: nanokit-esp32
summary: Moves a pan/tilt servo pair toward target coordinates received over Serial from a vision process.

firmware:
  - id: main
    path: .
    code_roots: [src, include]
    wifi: false

docs:
  readme: README.md
  wiring: docs/Wiring.md
  images: images

components:
  - id: pan_servo
    name: Pan servo
    kind: actuator
    status: confirmed
    power: { rail: external, note: External 5 V servo supply }
    pins:
      - { pin: Signal, gpio: 2,  dir: out, type: pwm, symbol: PAN_SERVO_PIN, note: PWM-capable output; the onboard LED also shows activity }
      - { pin: VCC,    rail: external, note: External 5 V servo supply }
      - { pin: GND,    rail: GND, note: Common ground with the servo supply }

  - id: tilt_servo
    name: Tilt servo
    kind: actuator
    status: confirmed
    power: { rail: external, note: External 5 V servo supply }
    pins:
      - { pin: Signal, gpio: 26, dir: out, type: pwm, symbol: TILT_SERVO_PIN, note: PWM-capable general GPIO }
      - { pin: VCC,    rail: external, note: External 5 V servo supply }
      - { pin: GND,    rail: GND, note: Common ground with the servo supply }

externals:
  - { id: vision, name: "Vision process (Serial X=.. Y=..)" }

links:
  - { from: vision, to: main, label: "USB Serial 115200", kind: one }
