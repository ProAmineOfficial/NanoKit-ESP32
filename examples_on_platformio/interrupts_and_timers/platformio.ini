; NanoKit Integrated ESP32 PlatformIO baseline
[env:nanokit_esp32]
platform = espressif32 @ 8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No external libraries: attachInterrupt, the timerBegin/timerAlarm family, and the portMUX spinlock come with the Arduino core.
