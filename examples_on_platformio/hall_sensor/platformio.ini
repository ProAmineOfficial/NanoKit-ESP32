; Developed by Amine Saoud ibn al-Bashir.
; NanoKit Integrated ESP32 PlatformIO baseline
[env:nanokit_esp32]
platform = espressif32 @ 6.13.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Pinned to espressif32 6.13.0 (Arduino-ESP32 core 2.0.17) on purpose: hallRead() and the ESP-IDF Hall driver were
; removed in core 3.x, which every other NanoKit project uses (espressif32 8.0.0). No external libraries.
