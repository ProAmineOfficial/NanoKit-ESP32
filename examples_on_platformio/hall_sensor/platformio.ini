; NanoKit Integrated ESP32 PlatformIO baseline
[env:nanokit_esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; No external libraries: hallRead() comes with the Arduino-ESP32 core 2.x that the espressif32 platform installs.
