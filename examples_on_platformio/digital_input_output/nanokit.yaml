# Developed by Amine Saoud ibn al-Bashir.
# Genius hardware manifest - single source of truth for this project's wiring.
genius: 1
name: Digital Input Output
category: example
status: complete
board: nanokit-esp32
summary: Reads a push button with the internal pull-up, debounces it without delay(), and toggles an LED on each press.

firmware:
  - id: main
    path: .
    code_roots: [src, include]
    wifi: false

docs:
  readme: README.md
  wiring: docs/Wiring.md
  images: images

components:
  - id: button
    name: Push button
    kind: sensor
    status: confirmed
    power: { rail: none }
    note: Normally-open momentary switch between the GPIO and GND; the ESP32 internal pull-up replaces an external resistor.
    pins:
      - { pin: Leg 1, gpio: 4, dir: in, symbol: BUTTON_PIN, note: "Internal pull-up keeps the pin HIGH; pressing reads LOW" }
      - { pin: Leg 2, rail: GND, note: Pressing connects the GPIO to ground }

  - id: led
    name: External LED + 220 ohm resistor
    kind: display
    status: confirmed
    power: { rail: none }
    note: Series resistor limits current to about 7 mA at 3.3 V, well inside the ESP32 GPIO rating.
    pins:
      - { pin: Anode via 220 ohm, gpio: 26, dir: out, symbol: LED_PIN, note: Safe general-purpose output drives the LED HIGH = on }
      - { pin: Cathode, rail: GND, note: Return path for the LED current }

  - id: builtin_led
    name: Onboard LED
    kind: display
    status: confirmed
    power: { rail: none }
    note: Mirrors the external LED so the example can be tried with no wiring at all.
    pins:
      - { pin: LED, gpio: 2, dir: out, symbol: BUILTIN_LED_PIN, note: Onboard LED on the PWM_OUT0 pin }
